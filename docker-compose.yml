# Local/production-like stack: docker compose up --build
# Set JWT_ACCESS_SECRET and JWT_REFRESH_SECRET in your shell or an .env file (16+ chars each).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ereader
      POSTGRES_PASSWORD: ereader
      POSTGRES_DB: ereader
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ereader"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ereader:ereader@db:5432/ereader
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads

volumes:
  dbdata:
  uploads:
